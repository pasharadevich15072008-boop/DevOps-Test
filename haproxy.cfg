global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 10s
    timeout client  1m
    timeout server  1m

frontend postgres_front
    bind *:5432
    default_backend postgres_back

backend postgres_back
    mode tcp
    balance roundrobin
    server pg1 postgres_db_1:5432 check
    server pg2 postgres_db_2:5432 check
